name: Proposal
description: Propose a feature, or a change to a kind of manifest, a contract, or the plugin protocol.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do, and what stands in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. For a kind, a contract, or the protocol, show the shape it would take.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, and why this one is better.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: What existing workspaces, packs, or plugins would have to change.
